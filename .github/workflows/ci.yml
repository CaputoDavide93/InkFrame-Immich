name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: hassfest and HACS rules change under us

jobs:
  renderer:
    name: Renderer tests and generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt pytest
      - run: python -m pytest server/tests -q
      - name: Generated tables match the code
        run: python tools/gen_docs.py --check

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The domain is not yet in home-assistant/brands; that is a separate
          # pull request there. Every other HACS check runs.
          ignore: brands

  firmware:
    name: ESPHome config validates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install esphome
      - name: Validate with the example secrets and a generated key
        # The example carries CHANGE_ME_KEY on purpose: a real-looking key in
        # an example file is indistinguishable from a leaked one to a secret
        # scanner. ESPHome needs a real 32-byte key to validate, so make one.
        run: |
          cp firmware/secrets.yaml.example firmware/secrets.yaml
          sed -i "s|CHANGE_ME_KEY|$(openssl rand -base64 32)|" firmware/secrets.yaml
          esphome config firmware/immich-frame.yaml > /dev/null
