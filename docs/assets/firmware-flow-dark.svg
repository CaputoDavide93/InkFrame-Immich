<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 624" width="1180" height="624" role="img" aria-label="Boot, connect to Wi-Fi, call /wake and store the reply or keep the fallback values, fetch the frame with one retry, draw it, hold the OTA window, then sleep unless Stay awake is on."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="60" y="48" width="232" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(76.0,70.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="107.0" y="85.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Boot</text><rect x="60" y="148" width="232" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="76.0" y="185.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Wi-Fi connects</text><rect x="60" y="248" width="232" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="76.0" y="285.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">GET /wake</text><polyline points="176.0,112 176.0,140" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="176.0,212 176.0,240" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="474" y="176" width="232" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="490.0" y="204.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Store sleep_seconds,</text><text x="490.0" y="228.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">ota_window_seconds</text><rect x="474" y="300" width="232" height="64" rx="10" fill="#2a1d14" stroke="#ffa657" stroke-width="1"/><text x="490.0" y="328.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffa657" text-anchor="start" font-weight="600">Keep the fallback values</text><text x="490.0" y="352.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffa657" text-anchor="start">and log a warning</text><polyline points="300,268 466,212" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="383.0" y="232.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">reply</text><polyline points="300,288 466,330" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="383.0" y="326.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">unreachable</text><rect x="888" y="232" width="232" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="904.0" y="260.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Fetch /frame.bmp</text><text x="904.0" y="284.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">online_image</text><polyline points="714,208 880,254" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="714,330 880,286" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1128,264 1168,264 1168,190 1004.0,190 1004.0,224" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="1014.0" y="176.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">error: wait 10 s, retry once</text><rect x="888" y="372" width="232" height="64" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><text x="904.0" y="409.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">Display update</text><polyline points="1004.0,304 1004.0,364" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="1004.0" y="330.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">ok</text><rect x="474" y="372" width="232" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="490.0" y="409.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Hold the OTA window</text><polyline points="880,404 714,404" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polygon points="176.0,365.0 283.0,404 176.0,443.0 69.0,404" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="176.0" y="401.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Stay awake</text><text x="176.0" y="415.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">switch on?</text><polyline points="466,404 291.0,404" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="30" y="486" width="150" height="56" rx="10" fill="#2a1d14" stroke="#ffa657" stroke-width="1"/><text x="46.0" y="519.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffa657" text-anchor="start" font-weight="600">Stay awake</text><rect x="202" y="486" width="166" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="218.0" y="519.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Deep sleep</text><polyline points="130.0,438 105,478" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="117.5" y="456.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="end">yes</text><polyline points="222.0,438 285,478" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="253.5" y="456.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">no</text><line x1="24" y1="572" x2="1156" y2="572" stroke="#232a33" stroke-width="1"/><text x="24.0" y="598.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Both failure paths continue rather than stop: a panel that cannot reach the renderer still draws whatever it already has, and sleeps.</text></svg>