<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Immich sends twenty scored candidates to the renderer, which sends one 48 KB one-bit frame to the ePaper frame. Home Assistant exchanges control and status with the renderer. The panel never talks to Home Assistant."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="56" width="268" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="71.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Immich</text><text x="40.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Your photo library</text><text x="40.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">on your own server</text><rect x="456" y="56" width="268" height="108" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(472.0,69.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="503.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Renderer</text><text x="472.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">Scores 20 candidates,</text><text x="472.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">renders the calmest</text><rect x="888" y="56" width="268" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(904.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M9 20h6 M12 17v3 M6 13l3.5-4 2.5 3 2-2.5L18 13"/></g><text x="935.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">ePaper Frame</text><text x="904.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">800 x 480, one bit</text><text x="904.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">awake ~35s a week</text><rect x="456" y="244" width="268" height="108" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(472.0,257.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7 M6 10v9h12v-9 M10 19v-5h4v5"/></g><text x="503.0" y="272.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Home Assistant</text><text x="472.0" y="296.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Settings, previews, next photo</text><polyline points="300,110.0 448,110.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="374.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">20 scored candidates</text><polyline points="732,110.0 880,110.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="806.0" y="101.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">one 48 KB frame</text><polyline points="590.0,236 590.0,172" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#b)"/><text x="604.0" y="208.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">control and status</text><line x1="24" y1="378" x2="1156" y2="378" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">The panel never talks to Home Assistant. Both talk to the renderer, which is the only part awake all the time.</text></svg>