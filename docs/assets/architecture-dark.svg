<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="Immich sends scored candidates to the renderer, which sends one one-bit frame to the e-paper panel; Home Assistant controls the renderer"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="56" width="268" height="108" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(44.0,77.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="75" y="93" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Immich</text><text x="44" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa4b0">Your photo library</text><text x="44" y="139" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa4b0">on your own server</text><rect x="456" y="56" width="268" height="108" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(476.0,77.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="507" y="93" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#ffffff">Renderer</text><text x="476" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" opacity="0.82">Scores 20 candidates,</text><text x="476" y="139" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" opacity="0.82">renders the calmest</text><rect x="888" y="56" width="268" height="108" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(908.0,77.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M9 20h6 M12 17v3 M6 13l3.5-4 2.5 3 2-2.5L18 13"/></g><text x="939" y="93" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">ePaper Frame</text><text x="908" y="120" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa4b0">800 x 480, one bit</text><text x="908" y="139" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa4b0">awake ~35s a week</text><rect x="456" y="244" width="268" height="108" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(476.0,265.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7 M6 10v9h12v-9 M10 19v-5h4v5"/></g><text x="507" y="281" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#e6edf3">Home Assistant</text><text x="476" y="308" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa4b0">Settings, previews, next photo</text><line x1="300" y1="110.0" x2="448" y2="110.0" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="374.0" y="99.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2">20 scored candidates</text><line x1="732" y1="110.0" x2="880" y2="110.0" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="806.0" y="99.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2">one 48 KB frame</text><line x1="590.0" y1="236" x2="590.0" y2="172" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#b)"/><text x="604.0" y="208.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2">control and status</text><line x1="24" y1="378" x2="1156" y2="378" stroke="#232a33" stroke-width="1"/><text x="24" y="404" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0">The panel never talks to Home Assistant. Both talk to the renderer, which is the only part awake all the time.</text></svg>