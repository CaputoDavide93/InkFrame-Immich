<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 316" width="1180" height="316" role="img" aria-label="Boot, connect and call /wake. On a draw: fetch the frame, draw it, acknowledge it and hold the OTA window. On a check: go straight to deep sleep. Either way the timer fires at the next clock slot and it boots again."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="75.3" y="96.0" width="62.2" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="106.4" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">Boot</text><rect x="171.5" y="96.0" width="69.7" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="206.3" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">Wi-Fi</text><polyline points="142.49000000000004,112 166.49000000000004,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="275.2" y="96.0" width="99.9" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="325.1" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">GET /wake</text><polyline points="246.19000000000003,112 270.19000000000005,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="409.1" y="96.0" width="137.6" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="477.8" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">GET /frame.bmp</text><polyline points="380.05000000000007,112 404.05000000000007,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="580.6" y="96.0" width="62.2" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="611.7" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">Draw</text><polyline points="551.61,112 575.6100000000001,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="676.8" y="96.0" width="145.1" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="749.3" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">POST /frame/ack</text><polyline points="647.7700000000002,112 671.7700000000001,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="855.9" y="96.0" width="107.4" height="32" rx="16.0" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><text x="909.6" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="500">OTA window</text><polyline points="826.87,112 850.8700000000001,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="997.3" y="96.0" width="107.4" height="32" rx="16.0" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="1051.0" y="116.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">Deep sleep</text><polyline points="968.2700000000002,112 992.27,112" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="325.12000000000006,92 325.12000000000006,50 1050.97,50 1050.97,92" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="688.0" y="42.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">draw: false, about 7 s awake</text><polyline points="909.5700000000002,132 909.5700000000002,166" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="855.9" y="168.0" width="107.4" height="32" rx="16.0" fill="#f1f4f9" stroke="#d8dee4" stroke-width="1"/><text x="909.6" y="188.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="500">Held awake</text><text x="897.6" y="154.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="end">Stay awake on</text><polyline points="1050.97,132 1050.97,224 106.41000000000004,224 106.41000000000004,132" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="508.0" y="216.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">timer: sleep_seconds, to the next clock slot</text><line x1="24" y1="264" x2="1156" y2="264" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="290.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Only a drawing wake holds the OTA window. Set it to 60 s or more and the renderer makes every wake a draw, so the panel can be flashed.</text></svg>