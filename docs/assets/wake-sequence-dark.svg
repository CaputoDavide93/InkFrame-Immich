<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" role="img" aria-label="The panel calls /wake; the renderer either rotates to a new photograph or serves the one already rendered, replies with the sleep parameters, serves the frame, and the panel draws it and sleeps."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="62.0" y="26" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(78.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M9 20h6 M12 17v3 M6 13l3.5-4 2.5 3 2-2.5L18 13"/></g><text x="109.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Panel</text><line x1="150" y1="70" x2="150" y2="404" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="502.0" y="26" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(518.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="549.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Renderer</text><line x1="590" y1="70" x2="590" y2="404" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="942.0" y="26" width="176" height="44" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(958.0,38.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="989.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Immich</text><line x1="1030" y1="70" x2="1030" y2="404" stroke="#30363d" stroke-width="1" stroke-dasharray="4 5"/><rect x="360" y="100" width="740" height="122" rx="8" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="5 4"/><text x="374.0" y="118.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="start" font-weight="600">if the current frame was already collected</text><polyline points="158,88 582,88" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="370.0" y="79.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">GET /wake</text><polyline points="598,146 1022,146" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="810.0" y="137.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">random landscape photographs</text><polyline points="590,178 644,178 644,204 596,204" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="656.0" y="182.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">score 20 candidates, render the calmest</text><text x="374.0" y="244.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="start">otherwise: keep it, do not rotate</text><polyline points="582,272 158,272" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="370.0" y="263.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">generation, sleep_seconds, ota_window_seconds</text><polyline points="158,314 582,314" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="370.0" y="305.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">GET /frame.bmp</text><polyline points="582,348 158,348" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="370.0" y="339.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">48 KB one-bit BMP</text><polyline points="150,380 204,380 204,406 156,406" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="216.0" y="384.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">draw, wait the OTA window, deep sleep</text><line x1="24" y1="418" x2="1156" y2="418" stroke="#232a33" stroke-width="1"/><text x="24.0" y="444.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">A dashed arrow is a reply. The panel makes exactly two requests per wake.</text></svg>