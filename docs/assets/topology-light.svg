<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 350" width="1180" height="350" role="img" aria-label="Immich, the renderer and Home Assistant are always on; the panel wakes about thirty-five seconds a week."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="40" width="812" height="240" rx="14" fill="#f7f9fb" stroke="#d8dee4" stroke-width="1" stroke-dasharray="6 5"/><text x="42.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6673" text-anchor="start" font-weight="600">ALWAYS ON</text><rect x="868" y="40" width="288" height="240" rx="14" fill="#f7f9fb" stroke="#d8dee4" stroke-width="1" stroke-dasharray="6 5"/><text x="886.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6673" text-anchor="start" font-weight="600">AWAKE ~35s A WEEK</text><rect x="56" y="88" width="250" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,101.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="103.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Immich</text><text x="72.0" y="140.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Photographs and faces</text><rect x="56" y="196" width="250" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,209.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7 M6 10v9h12v-9 M10 19v-5h4v5"/></g><text x="103.0" y="224.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Home Assistant</text><text x="72.0" y="248.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Settings and previews</text><rect x="546" y="142" width="250" height="92" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(562.0,155.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="593.0" y="170.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Renderer</text><text x="562.0" y="194.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">Chooses and prepares</text><rect x="900" y="142" width="224" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(916.0,155.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></g><text x="947.0" y="170.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Panel</text><text x="916.0" y="194.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Draws, then sleeps</text><polyline points="306,134 546,176" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="306,242 546,200" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="892,188 804,188" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><line x1="24" y1="298" x2="1156" y2="298" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Everything the panel needs is decided while it is asleep, so its whole waking life is one fetch and one draw.</text></svg>