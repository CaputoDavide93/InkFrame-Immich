<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 364" width="1180" height="364" role="img" aria-label="Immich, the renderer and Home Assistant are always on; the panel sleeps between wakes and is awake about 7 seconds to check and 35 to draw."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="40" width="812" height="260" rx="14" fill="#f7f9fb" stroke="#d8dee4" stroke-width="1" stroke-dasharray="6 5"/><text x="42.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6673" text-anchor="start" font-weight="600">ALWAYS ON</text><rect x="868" y="40" width="288" height="260" rx="14" fill="#f7f9fb" stroke="#d8dee4" stroke-width="1" stroke-dasharray="6 5"/><text x="886.0" y="64.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#5b6673" text-anchor="start" font-weight="600">ASLEEP BETWEEN WAKES</text><rect x="56" y="80" width="250" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(72.0,93.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="103.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Immich</text><text x="72.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Photographs and faces</text><rect x="56" y="188" width="250" height="92" rx="10" fill="#ffffff" stroke=