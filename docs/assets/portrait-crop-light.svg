<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-label="A portrait is cropped to 800 by 480: the window is placed on the faces Immich found, or centred and biased above the middle when there are none."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="40" y="104" width="236" height="76" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(56.0,117.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="87.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Portrait</text><text x="56.0" y="156.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">1440 x 1920</text><polygon points="430,95.0 537.0,142 430,189.0 323.0,142" fill="#f1f4f9" stroke="#d8dee4" stroke-width="1"/><text x="430.0" y="139.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Faces from</text><text x="430.0" y="153.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">/api/faces?</text><rect x="636" y="44" width="268" height="86" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="652.0" y="72.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Window placed on them</text><text x="652.0" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">a third down for a full body,</text><text x="652.0" y="114.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">centred for a close-up</text><rect x="636" y="166" width="268" height="76" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="652.0" y="194.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Window centred</text><text x="652.0" y="218.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">biased above the middle</text><rect x="972" y="104" width="168" height="76" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><text x="988.0" y="147.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">800 x 480</text><polyline points="284,142 315,142" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="545,124 628,87" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="586.5" y="99.5" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">yes</text><polyline points="545,160 628,204" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="586.5" y="198.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">no</text><polyline points="912,87 964,128" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="912,204 964,156" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><line x1="24" y1="278" x2="1156" y2="278" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="304.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Without face.read on the API key Immich returns no boxes, the crop falls back to centred, and nothing breaks.</text></svg>