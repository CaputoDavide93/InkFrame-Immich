<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-label="Random assets come from Immich a hundred at a time, are filtered by orientation and then by whether a camera took them, then twenty are downloaded and scored for busyness, and a calm one is rendered."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="52" width="200" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,65.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="71.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Immich random</text><text x="40.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">100 a round, up to 4</text><polygon points="348,48.0 441.0,92.0 348,136.0 255.0,92.0" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="348.0" y="89.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Landscape, or</text><text x="348.0" y="103.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">portraits on?</text><polygon points="628,48.0 721.0,92.0 628,136.0 535.0,92.0" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="628.0" y="89.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Camera make</text><text x="628.0" y="103.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">in EXIF?</text><rect x="786" y="52" width="172" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="802.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Score 20</text><text x="802.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">download, rate busyness</text><rect x="986" y="52" width="170" height="80" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><text x="1002.0" y="80.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Render one</text><text x="1002.0" y="104.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">random under the cap,</text><text x="1002.0" y="122.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">else the calmest</text><polyline points="232,92.0 247,92.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="449,92.0 527,92.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="488.0" y="83.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">yes</text><polyline points="729,92.0 778,92.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="753.5" y="83.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">yes</text><polyline points="966,92.0 978,92.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="348,142.0 348,184" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="348.0" y="167.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="end">no</text><polyline points="628,142.0 628,184" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="628.0" y="167.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="end">no</text><rect x="276" y="192" width="144" height="48" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="292.0" y="221.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Dropped</text><rect x="556" y="192" width="144" height="48" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="572.0" y="221.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">Dropped</text><line x1="24" y1="278" x2="1156" y2="278" stroke="#232a33" stroke-width="1"/><text x="24.0" y="304.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Orientation and EXIF come from the search result, so both filters are free. Only the twenty that survive are ever downloaded.</text></svg>