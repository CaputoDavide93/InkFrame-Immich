<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 372" width="1180" height="372" role="img" aria-label="A hundred random assets are filtered by orientation, then by whether a camera took them, then twenty are downloaded and scored for busyness and the calmest is rendered."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="118" width="200" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,131.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="71.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Immich random</text><text x="40.0" y="170.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">100 assets</text><polygon points="348,110.0 441.0,154 348,198.0 255.0,154" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="348.0" y="151.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">Landscape by</text><text x="348.0" y="165.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="middle">orientation?</text><polygon points="628,110.0 721.0,154 628,198.0 535.0,154" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="628.0" y="151.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"