<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Boot, connect to Wi-Fi and call /wake, storing the reply or keeping the fallbacks. If told to draw: fetch the frame with one retry, update the display, acknowledge it and hold the OTA window. Then sleep unless Stay awake is on."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="40" width="190" height="60" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,60.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="71.0" y="75.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Boot</text><rect x="24" y="130" width="190" height="60" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,150.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0 M5.5 12.5a10 10 0 0 1 13 0 M9 16a5 5 0 0 1 6 0 M12 19.5h.01"/></g><text x="71.0" y="165.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Wi-Fi connects</text><rect x="24" y="220" width="190" height="60" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="40.0" y="255.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">GET /wake</text><polyline points="119.0,106 119.0,124" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="119.0,196 119.0,214" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="150" width="262" height="80" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="316.0" y="178.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Store the reply</text><text x="316.0" y="202.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">sleep_seconds, generation,</text><text x="316.0" y="220.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">ota_window_seconds, draw</text><rect x="300" y="268" width="262" height="80" rx="10" fill="#fff4ed" stroke="#9a3412" stroke-width="1"/><text x="316.0" y="296.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#9a3412" text-anchor="start" font-weight="600">Keep the fallbacks</text><text x="316.0" y="320.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a3412" text-anchor="start">sleep 1 h, nothing to draw</text><polyline points="222,240 292,196" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="257.0" y="208.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">reply</text><polyline points="222,262 292,306" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="257.0" y="304.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">no reply</text><polygon points="704,206.0 792.0,250 704,294.0 616.0,250" fill="#f1f4f9" stroke="#d8dee4" stroke-width="1"/><text x="704.0" y="247.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Told to</text><text x="704.0" y="261.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">draw?</text><polyline points="570,192 654,220" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="570,306 654,280" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="588" y="352" width="232" height="80" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="604.0" y="380.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Fetch /frame.bmp</text><text x="604.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">on error wait 10 s, retry once;</text><text x="604.0" y="422.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">a second error sleeps 1 h</text><polyline points="704,300 704,344" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="704.0" y="326.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">yes</text><rect x="588" y="484" width="232" height="60" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><text x="604.0" y="519.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">Display update</text><polyline points="704,440 704,476" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="714.0" y="466.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">ok</text><rect x="940" y="484" width="216" height="60" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="956.0" y="519.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">POST /frame/ack</text><polyline points="828,514 932,514" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="880.0" y="505.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">no fault</text><rect x="940" y="362" width="216" height="60" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="956.0" y="397.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Hold the OTA window</text><polyline points="1048.0,476 1048.0,430" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polygon points="1048.0,206.0 1136.0,250 1048.0,294.0 960.0,250" fill="#f1f4f9" stroke="#d8dee4" stroke-width="1"/><text x="1048.0" y="247.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">Stay awake</text><text x="1048.0" y="261.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0f172a" text-anchor="middle">switch on?</text><polyline points="1048.0,354 1048.0,300" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="800,250 952.0,250" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="876.0" y="241.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">no</text><rect x="790" y="40" width="170" height="60" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(806.0,60.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></g><text x="837.0" y="75.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Deep sleep</text><rect x="1000" y="40" width="156" height="60" rx="10" fill="#fff4ed" stroke="#9a3412" stroke-width="1"/><text x="1016.0" y="75.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#9a3412" text-anchor="start" font-weight="600">Stay awake</text><polyline points="1018.0,202 875,108" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="946.5" y="151.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="end">no</text><polyline points="1078.0,202 1078,108" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="1078.0" y="151.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">yes</text><line x1="24" y1="558" x2="1156" y2="558" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="584.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Every path ends in a sleep: a panel that cannot reach the renderer keeps the photo it has and asks again in an hour.</text></svg>