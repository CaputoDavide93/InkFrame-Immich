<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="1180" height="330" role="img" aria-label="Boot, connect, call /wake, fetch the frame, draw it, hold an OTA window, then deep sleep until the timer fires and it boots again."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="74.0" y="100.0" width="62.2" height="32" rx="16.0" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="105.1" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">Boot</text><rect x="182.2" y="100.0" width="69.7" height="32" rx="16.0" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="217.0" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">Wi-Fi</text><polyline points="142.16,116 176.16,116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="297.9" y="100.0" width="99.9" height="32" rx="16.0" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="347.8" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">GET /wake</text><polyline points="257.86,116 291.86,116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="443.7" y="100.0" width="137.6" height="32" rx="16.0" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="512.5" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">GET /frame.bmp</text><polyline points="403.72,116 437.72,116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="627.3" y="100.0" width="62.2" height="32" rx="16.0" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="658.4" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">Draw</text><polyline points="587.28,116 621.28,116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="735.4" y="100.0" width="107.4" height="32" rx="16.0" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><text x="789.1" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="500">OTA window</text><polyline points="695.44,116 729.4399999999999,116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="888.8" y="100.0" width="107.4" height="32" rx="16.0" fill="#161b22" stroke="#30363d" stroke-width="1"/><text x="942.5" y="120.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">Deep sleep</text><polyline points="848.84,116 882.8399999999999,116" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="942.54,136 942.54,190 105.08,190 105.08,136" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="523.8" y="208.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">timer, 72 hours later</text><polyline points="789.14,96 789.14,58" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><rect x="735.4" y="24.0" width="107.4" height="32" rx="16.0" fill="#1b2230" stroke="#30363d" stroke-width="1"/><text x="789.1" y="44.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle" font-weight="500">Held awake</text><text x="803.1" y="80.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">Stay awake switch on</text><line x1="24" y1="278" x2="1156" y2="278" stroke="#232a33" stroke-width="1"/><text x="24.0" y="304.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">The OTA window is the only moment the panel can be reflashed. Everything after it is decided by the renderer's reply.</text></svg>