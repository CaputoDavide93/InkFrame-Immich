<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" role="img" aria-label="The panel wakes on a clock slot and calls /wake. The renderer renders a new photo if a draw is due, serves a photo that is already waiting, or keeps the current one. It replies with generation, draw, sleep_seconds and ota_window_seconds. On a draw the panel fetches the 48 KB one-bit BMP, draws it, acknowledges it, holds the OTA window and sleeps; on a check it sleeps straight away."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="134.0" width="220" height="92" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,147.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M9 20h6 M12 17v3 M6 13l3.5-4 2.5 3 2-2.5L18 13"/></g><text x="71.0" y="162.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Panel wakes</text><text x="40.0" y="186.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">on the next clock slot</text><rect x="340" y="134.0" width="236" height="92" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(356.0,147.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="387.0" y="162.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Renderer decides</text><text x="356.0" y="186.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">draw, or only a check</text><polyline points="252,180.0 332,180.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="292.0" y="171.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">GET /wake</text><rect x="636" y="40" width="268" height="84" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="652.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Draw due, nothing waiting</text><text x="652.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">random pick from Immich,</text><text x="652.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">score 20, render a calm one</text><rect x="636" y="138" width="268" height="84" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="652.0" y="166.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">A photo is waiting</text><text x="652.0" y="190.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">asked for, or held for the draw:</text><text x="652.0" y="208.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">serve it, render nothing new</text><rect x="636" y="236" width="268" height="84" rx="10" fill="#f1f4f9" stroke="#d8dee4" stroke-width="1"/><text x="652.0" y="264.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Nothing due</text><text x="652.0" y="288.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">keep it, do not rotate</text><text x="652.0" y="306.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">draw: false</text><rect x="1000" y="40" width="156" height="84" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(1016.0,53.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="1047.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Immich</text><text x="1016.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">your library</text><polyline points="912,82.0 992,82.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="584,180.0 628,82.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="584,180.0 628,180.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="584,180.0 628,278.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><rect x="24" y="396" width="196" height="100" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="40.0" y="424.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">The reply</text><text x="40.0" y="448.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">generation, draw,</text><text x="40.0" y="466.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">sleep_seconds,</text><text x="40.0" y="484.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">ota_window_seconds</text><rect x="310" y="396" width="236" height="100" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="326.0" y="424.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Fetch the frame</text><text x="326.0" y="448.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">GET /frame.bmp?gen=N</text><text x="326.0" y="466.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">48 KB, one bit a pixel</text><rect x="636" y="396" width="268" height="100" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><text x="652.0" y="424.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Draw, then acknowledge</text><text x="652.0" y="448.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">POST /frame/ack?gen=N</text><text x="652.0" y="466.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">only after a clean refresh</text><rect x="1000" y="396" width="156" height="100" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(1016.0,409.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></g><text x="1047.0" y="424.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Deep sleep</text><text x="1016.0" y="448.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">to the next slot,</text><text x="1016.0" y="466.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#5b6673" text-anchor="start">sleep_seconds</text><polyline points="458.0,234.0 458.0,354 122.0,354 122.0,388" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="470.0" y="318.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">reply</text><polyline points="228,446.0 302,446.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="265.0" y="437.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">draw: true</text><polyline points="554,446.0 628,446.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="912,446.0 992,446.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="952.0" y="437.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">OTA window</text><polyline points="122.0,504 122.0,530 1078.0,530 1078.0,504" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="522.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">draw: false, the common case</text><line x1="24" y1="568" x2="1156" y2="568" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="594.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">A dashed arrow is a reply. A check makes one request and is awake about 7 s; a draw adds the fetch and the acknowledgement, about 35 s.</text></svg>